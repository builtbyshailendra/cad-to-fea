name: ci

on:
  push:
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cad-mesh-ccx:
    name: CadQuery, build123d, Gmsh, CalculiX
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      CADFEA_REQUIRE: cadquery,build123d,gmsh,ccx  # missing one of these fails, never skips
      OMP_NUM_THREADS: "2"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt
      - name: system packages (CalculiX, and the GL/X libraries the gmsh wheel links against)
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q --no-install-recommends calculix-ccx libglu1-mesa libxrender1 libxcursor1 libxft2 libxinerama1 libxi6
          dpkg -s calculix-ccx | grep -i '^version'
      - name: python packages
        run: pip install -r requirements-ci.txt
      - name: step 1, geometry in CadQuery and build123d
        run: python scripts/build_geometry.py
      - name: step 2, Gmsh meshes
        run: python scripts/build_meshes.py
      - name: step 3, CalculiX
        run: python scripts/run_ccx.py --with-c3d4 --with-nu0
      - name: tests
        run: python -m pytest --junitxml=out/junit-cad.xml
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: cad-mesh-ccx
          path: |
            out/mesh/*.msh
            out/mesh/*.json
            out/results/
            out/junit-cad.xml
            results/geometry.txt
            results/meshes.txt
          retention-days: 5

  fenicsx:
    name: FEniCSx, comparison, report
    needs: cad-mesh-ccx
    if: ${{ !cancelled() }}  # still compare when a check in the first job failed
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    container:
      image: ghcr.io/fenics/dolfinx/dolfinx:v0.10.0-r1
    env:
      CADFEA_REQUIRE: dolfinx
      CADFEA_WHERE: CI
      OMP_NUM_THREADS: "1"
      OMPI_ALLOW_RUN_AS_ROOT: "1"
      OMPI_ALLOW_RUN_AS_ROOT_CONFIRM: "1"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v4
        with:
          name: cad-mesh-ccx
          path: .
      - name: versions
        run: |
          python3 -c "import dolfinx, gmsh, numpy, sys; print('python', sys.version.split()[0], 'dolfinx', dolfinx.__version__, 'gmsh', gmsh.__version__, 'numpy', numpy.__version__)"
          python3 -m pytest --version || python3 -m pip install pytest==9.2.0
          python3 -c "import matplotlib" || python3 -m pip install matplotlib
      - name: step 4, FEniCSx
        run: python3 scripts/run_fenicsx.py --with-p1
      - name: tests
        run: python3 -m pytest --junitxml=out/junit-fenicsx.xml
      - name: every test passed in at least one job
        run: python3 scripts/check_no_skips.py out/junit-cad.xml out/junit-fenicsx.xml
      - name: step 5, report
        if: ${{ !cancelled() }}
        run: python3 scripts/report.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results
          path: |
            results/
            out/results/
            out/junit-*.xml
          retention-days: 14
